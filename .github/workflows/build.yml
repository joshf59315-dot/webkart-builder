name: Build Android app
run-name: Build ${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string
      config_url:
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download app settings
        env:
          CONFIG_URL: ${{ inputs.config_url }}
        run: curl -fsSL "$CONFIG_URL" -o config.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate Android project
        run: python3 generator/generate.py config.json android
      - name: Create signing key
        run: |
          KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore android/release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Web Kart App"
      - name: Compile and sign
        run: gradle -p android $(cat android/gradle_tasks.txt) --no-daemon --stacktrace
      - name: Publish files
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          NAME=$(cat android/artifact_name.txt)
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk "out/$NAME.apk"; fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab "out/$NAME.aab"; fi
          ls out/*
          gh release create "build-$BUILD_ID" out/* --repo "$GITHUB_REPOSITORY" --title "Build $BUILD_ID" --notes "Generated by Web Kart"
